[project]
name = "icekb"
version = "0.1.0"
description = "Sync pipeline and validators for Iceberg Context, an unofficial knowledge base for contributing to Apache Iceberg."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["apache-iceberg", "knowledge-base", "open-source", "claude-code", "skill"]
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.urls]
Repository = "https://github.com/vishnuprakaz/iceberg-context"

[project.scripts]
icekb = "icekb.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["pipeline"]
include = ["icekb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["pipeline/prototypes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
